<svg viewBox="0 0 400 400"
     xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <!-- 圆形渐变边框 -->
    <radialGradient id="grad" cx="50%" cy="50%" r="50%">
      <stop offset="0%"  stop-color="#764ba2"/>
      <stop offset="100%" stop-color="#667eea"/>
    </radialGradient>

    <!-- 圆形蒙版 -->
    <mask id="circle">
      <circle cx="200" cy="200" r="98" fill="white"/>
    </mask>
  </defs>

  <!-- 渐变圆环 -->
  <circle cx="200" cy="200" r="102" fill="url(#grad)"/>

  <!-- 头像（使用 href，无 xlink 前缀） -->
  <image href="https://raw.githubusercontent.com/LTtt456c/LTtt456c/main/f7e91b0b445d608852f2c892f09e8ea1.jpg"
         x="102" y="102" width="196" height="196"
         mask="url(#circle)"/>
</svg>
